<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found / Acdyon</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header / Navigation -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-name">Acdyon</span>
        <span class="brand-divider">/</span>
        <span class="brand-module">Job Ingestion Subsystem</span>
      </div>
      <div class="header-status">
        <span class="mono-cell text-muted">HTTP 404</span>
      </div>
    </header>

    <main class="app-main not-found-main">
      <div class="not-found-card">
        <span class="not-found-code">404</span>
        <h1 class="not-found-title">Page Not Found</h1>
        <p class="not-found-desc">
          The requested URL could not be found on this server. It may have been moved, renamed, or is temporarily unavailable.
        </p>
        <div class="not-found-actions">
          <a href="/" class="btn btn-primary">← Return to Dashboard</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Acdyon Job Ingestion Architecture</span>
      <span class="footer-divider">•</span>
      <span>Status: Resource Not Found</span>
    </footer>
  </div>
</body>
</html>
